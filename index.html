<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priorities</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Patrick+Hand&display=swap">
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--card:#fff;--bd:#111;--ac:#3a8fdc;--acf:#fff;--pk:#e27bbd;--gr:#4db08f;--sh:#111;--yl:#f5d061}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151b;--fg:#f6f6f6;--mut:#b5b5c0;--card:#22222b;--bd:#f6f6f6;--ac:#4aa0ee;--acf:#0d0d12;--pk:#d065aa;--gr:#3b9c7b;--yl:#dfb439;--sh:#000}}
:root[data-theme="dark"]{--bg:#15151b;--fg:#f6f6f6;--mut:#b5b5c0;--card:#22222b;--bd:#f6f6f6;--ac:#4aa0ee;--acf:#0d0d12;--pk:#d065aa;--gr:#3b9c7b;--yl:#dfb439;--sh:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.4 'Patrick Hand','Comic Sans MS',cursive,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 56px}
h1,h2,.code,button.p,.chip b{font-family:'Lilita One','Arial Black',Impact,sans-serif;font-weight:400}
h1{font-size:52px;line-height:1;color:var(--ac);-webkit-text-stroke:2.5px var(--bd);paint-order:stroke fill;text-shadow:3.5px 3.5px 0 var(--sh);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;text-align:center}
h1::after{content:' ✳';color:var(--pk);-webkit-text-stroke:0;text-shadow:none;font-size:28px;vertical-align:top}
h2{font-size:24px;text-transform:uppercase;letter-spacing:.5px;margin:24px 0 10px}
p.s{color:var(--mut);margin:0 0 18px;text-align:center;font-size:20px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:16px;box-shadow:4px 4px 0 var(--sh);padding:18px;margin:14px 0}
input,textarea{width:100%;box-sizing:border-box;padding:12px 14px;border:3px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-size:20px;margin:6px 0 12px;box-shadow:2px 2px 0 var(--sh)}
input:focus,textarea:focus{outline:none;background:rgba(58,143,220,0.05)}
button{font:inherit;cursor:pointer;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 18px;font-size:20px;box-shadow:3px 3px 0 var(--sh);transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
button.p{background:var(--ac);color:var(--acf);font-size:24px;letter-spacing:.5px;text-transform:uppercase;padding:14px;margin-top:10px;width:100%}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:2px 2px 0 var(--sh)!important}
.row{display:flex;gap:10px}.row>*{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2.5px solid var(--bd);border-radius:99px;font-size:18px;margin:3px;color:var(--fg);background:var(--card);box-shadow:2px 2px 0 var(--sh)}
.tag.done{background:var(--gr);color:#111}
.code{font:bold 26px ui-monospace,monospace;letter-spacing:4px;color:var(--ac);background:rgba(58,143,220,0.1);padding:2px 8px;border-radius:8px;border:2px solid var(--bd)}
.cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.col{flex:1;min-width:140px}
.col ol{padding-left:22px;margin:8px 0}
.err{color:var(--ac);min-height:24px;text-align:center;font-weight:bold;margin-top:10px}
.rk{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px 14px}
.rk b{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--pk);color:#111;border:2.5px solid var(--bd);font-family:'Lilita One',sans-serif;font-size:20px;box-shadow:2px 2px 0 var(--sh);flex:none}
.rk span{flex:1;font-size:22px;line-height:1.2}
.rk .btns{display:flex;gap:6px;flex:none}
.rk button{padding:8px 14px;font-size:18px;box-shadow:2px 2px 0 var(--sh)}
.ic{flex:none;display:inline-grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--gr);border:2.5px solid var(--bd);color:#111;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--sh)}
.ic svg{width:28px;height:28px;stroke-width:2.4}
.rk:nth-of-type(even) .ic{background:var(--pk);transform:rotate(3deg)}
.rk:nth-of-type(3n) .ic{background:var(--yl);transform:rotate(-2deg)}
li .ic{width:28px;height:28px;border-radius:8px;border-width:2px;vertical-align:middle;margin-right:8px}
li .ic svg{width:16px;height:16px}
.doo{display:flex;justify-content:center;gap:14px;margin:8px 0 20px}
.doo svg{width:40px;height:40px;stroke-width:2.2;color:var(--ac)}
.doo svg:nth-child(odd){transform:rotate(-6deg)}.doo svg:nth-child(even){transform:rotate(5deg)}
.doo svg:nth-child(3n+2){color:var(--pk)}.doo svg:nth-child(3n){color:var(--gr)}
.col:nth-child(3n+1) b{color:var(--ac)}.col:nth-child(3n+2) b{color:var(--pk)}.col:nth-child(3n) b{color:var(--gr)}
label{display:block;margin-top:6px;font-weight:bold;font-size:18px}
.mystery-box{border-color:var(--pk);background:rgba(226,123,189,0.12)}
.info-box{border-color:var(--ac);background:rgba(58,143,220,0.08)}
</style></main><body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const DEF=["Une manette de jeu", "Une trottinette électrique", "Un café à emporter", "Un tote bag", "Un avocat bien mûr", "Mes nouvelles baskets", "Mon téléphone", "Mes écouteurs", "La télécommande", "Un chargeur de téléphone", "Un oreiller", "Une brosse à dents", "Du papier bulle", "Un parapluie", "Un canapé confortable", "Une paire de lunettes de soleil", "Un vieux pull préféré", "Des chaussettes chaudes", "Un tupperware sans couvercle", "Une machine à laver", "Un vélo", "Mes clés de voiture", "Un grille-pain", "Un cactus", "Une grasse matinée", "Un embouteillage", "Un lundi matin", "La batterie à 1 %", "Le wifi qui coupe", "Le dernier carré de chocolat", "Un apéro entre amis", "Un fou rire", "Un rendez-vous chez le dentiste", "Un coup de soleil", "Une soirée karaoké", "Avoir raison dans une dispute", "Un compliment sincère", "Une frite oubliée au fond du sac", "Le dernier épisode d’une série", "Un trajet en train debout", "Une soirée jeux de société", "Une douche chaude", "Un voisin bruyant", "Un ticket de concert", "Un barbecue entre voisins", "Un week-end à la mer", "Un café offert", "Un câlin de ma grand-mère", "Le premier jour d’école", "Passer son permis", "Un mariage", "La naissance d’un enfant", "Un déménagement", "Le premier amour", "Une rupture", "Le premier salaire", "Un diplôme", "Un premier appart", "Une retraite bien méritée", "Un enterrement de vie de célibataire", "Un voyage autour du monde", "Un anniversaire surprise", "Dire « je t’aime » en premier", "Un premier jour de boulot", "Le Nouvel An", "Mes 30 ans", "Les vacances d’été de mon enfance", "Une réunion de famille", "Un premier voyage seul", "Adopter un animal", "Un entretien d’embauche", "Une crémaillère", "La liberté", "La paix dans le monde", "Le changement climatique", "L’amitié", "La justice", "La vérité", "L’argent", "Le temps", "La famille", "La santé", "Le sens de la vie", "L’amour", "La réussite", "La liberté d’expression", "L’égalité", "La démocratie", "La solitude", "La curiosité", "Le courage", "La mémoire", "Le bonheur", "La confiance", "L’intelligence artificielle", "La nature", "Des chatons", "Un perroquet qui parle", "Un super-pouvoir au choix", "Un voyage dans le temps", "Le Père Noël", "Mon ex", "Une bagarre d’oreillers géante", "Une chaussette dépareillée", "Un hamster en costume", "Avoir le dernier mot", "Un caniche trop mignon", "Une baguette de pain", "Un canard en plastique", "Un robot qui fait le ménage", "Une sieste dans un hamac", "Un ours en peluche géant", "Des pâtes au beurre", "Une crêpe au Nutella", "Un cornet de frites", "Un dinosaure de compagnie", "Un mojito en terrasse", "Un gâteau au chocolat entier", "Un selfie avec une célébrité", "Une licorne gonflable", "Un pigeon qui vole mon sandwich", "Des chaussettes avec des sandales", "Un hoquet qui ne s’arrête pas", "Un message envoyé à la mauvaise personne", "Un fou rire en pleine réunion", "Un pyjama grenouillère", "Un lama au bureau", "Une piscine remplie de boules en plastique", "Un orteil cogné dans un meuble", "Un chat qui renverse mon verre", "Un GPS qui dit « faites demi-tour »", "Un moustique à 3 h du matin", "Du ketchup sur les pâtes", "Un bonnet à pompon", "Un duel de pierre-feuille-ciseaux", "Un hoverboard", "Un selfie raté avec le doigt devant l’objectif", "Une licorne qui parle", "Un déguisement de banane", "Un tapis roulant à bonbons", "L’éducation", "La santé mentale", "L’égalité entre les femmes et les hommes", "La sécurité de ma famille", "Un métier qui a du sens", "Le droit de vote", "La biodiversité", "Savoir pardonner", "Vieillir en bonne santé", "Un toit au-dessus de ma tête", "L’équilibre entre vie pro et vie perso", "La transmission aux générations futures", "Rester fidèle à mes valeurs", "Un système de santé pour tous", "La liberté de choisir sa vie", "La réussite de mes enfants", "La paix intérieure", "Savoir dire non", "Être aimé pour qui je suis", "Le respect"];
const IC=[[/manette/,'gamepad-2'],[/trottinette|vélo|hoverboard/,'bike'],[/message/,'mail'],[/café/,'coffee'],[/tote|courses/,'shopping-bag'],[/avocat/,'apple'],[/baskets|orteil/,'footprints'],[/batterie/,'battery-low'],[/téléphone|chargeur|mot de passe/,'smartphone'],[/écouteurs/,'headphones'],[/télécommande|série|épisode/,'tv'],[/oreiller|sieste|grasse|sommeil|hamac|\blit\b/,'bed'],[/brosse|douche|bain/,'shower-head'],[/papier bulle|tupperware|boules/,'package'],[/parapluie/,'umbrella'],[/canapé|retraite/,'sofa'],[/lunettes/,'glasses'],[/pull|chaussettes|pyjama|bonnet|déguis|machine à laver|sandales/,'shirt'],[/clés|voiture|embouteillage|permis|GPS/,'car'],[/wifi/,'wifi'],[/famille|grand-mère|voisin/,'users'],[/enterrement|mariage|crémaillère|Nouvel An|artifice/,'party-popper'],[/apéro|mojito/,'martini'],[/jeux de société/,'dice-5'],[/perroquet|pigeon|liberté/,'bird'],[/dentiste/,'stethoscope'],[/intelligence artificielle|robot/,'bot'],[/mentale|mémoire|curiosité/,'brain'],[/santé|vieillir/,'activity'],[/fou rire|rire/,'laugh'],[/soleil|d’été/,'sun'],[/karaoké|musique|playlist|concert|ticket/,'music'],[/raison|dispute|dernier mot|bagarre/,'angry'],[/amour|aime\b|câlin|compliment|peluche/,'heart'],[/aimé|bonheur|paix intérieure/,'smile'],[/\bami|amitié/,'users'],[/\bchat|chaton/,'cat'],[/chien|caniche/,'dog'],[/animal|dinosaure|hamster|lama|licorne|canard/,'paw-print'],[/chocolat|gâteau|crêpe|anniversaire/,'cake'],[/sandwich|ketchup|pâtes|frite|cornet|grille-pain|baguette/,'utensils'],[/train/,'train-front'],[/barbecue/,'flame'],[/\bmer\b|week-end/,'waves'],[/école|diplôme|éducation/,'graduation-cap'],[/déménagement|appart|toit/,'house'],[/naissance|enfants/,'baby'],[/rupture|\bex\b/,'heart-crack'],[/dans le temps|^Le temps/,'hourglass'],[/paix/,'hand-heart'],[/voyage|montgolfière|Tokyo|monde/,'plane'],[/climat|nature|biodiversité/,'leaf'],[/justice|égalité|équilibre/,'scale'],[/vérité/,'search'],[/argent|compte en banque/,'coins'],[/lundi|réunion|boulot|métier|entretien|salaire/,'briefcase'],[/sens de la vie|idée/,'lightbulb'],[/réussite/,'trophy'],[/démocratie|vote/,'vote'],[/solitude/,'user'],[/courage|sécurité|valeurs/,'shield'],[/confiance|pardonner|respect/,'handshake'],[/super-pouvoir/,'zap'],[/Père Noël/,'gift'],[/selfie/,'camera'],[/moustique/,'bug'],[/pierre-feuille/,'scissors']];
const FB=['sparkles','star','smile','lightbulb','puzzle','rocket','palette','dice-5'];
function icn(c){for(const[r,n]of IC)if(r.test(c))return n;let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))>>>0;return FB[h%FB.length]}
const ico=c=>`<div class="ic"><i data-lucide="${icn(c)}"></i></div>`;
const DOO=()=>`<div class="doo">${['gamepad-2','bike','coffee','shopping-bag','cat','smartphone'].map(n=>`<i data-lucide="${n}"></i>`).join('')}</div>`;
const ic=()=>{if(window.lucide)try{lucide.createIcons()}catch(e){}};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const N=5;
let pool=[...DEF],used=[],peer=null,myId=null,isHost=false,conns={},hostConn=null,S=null,code='',name='',pick=null,pickRound=0,msg='',draft='',mysteryWord='',busy=false;
const rand4=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');

function deal(forcedWord){
  let av=pool.filter(c=>!used.includes(c));
  if(av.length<N){av=[...pool];used=[]}
  let count = N - (forcedWord ? 1 : 0);
  let c = av.sort(()=>Math.random()-.5).slice(0, count);
  if(forcedWord){c.push(forcedWord);}
  c.sort(()=>Math.random()-.5);
  used.push(...c);
  return c;
}

function broadcast(){for(const c of Object.values(conns))if(c.open)c.send({t:'state',S});render()}
function hostHandle(id,m){
 const p=S.players[id]||(S.players[id]={name:'',round:0,ranking:[],done:false});
 if(m.t==='hello')p.name=String(m.name||'').slice(0,20);
 if(m.t==='rank'&&m.round===S.round&&Array.isArray(m.ranking)&&m.ranking.every(c=>S.cards.includes(c))){p.round=S.round;p.ranking=m.ranking.slice(0,N);p.done=!!m.done}
 if(m.t==='mystery'&&m.round===S.round){S.mysteryWords[m.playerId]=m.word;}
 broadcast()}
function reset(m){msg=m||'';try{if(peer)peer.destroy()}catch(e){}peer=null;S=null;code='';isHost=false;conns={};hostConn=null;busy=false;pick=null;render()}
function create(){if(busy)return;name=$('nm').value.trim()||'Hôte';busy=true;msg='';render();host(0)}
function host(tries){
 code=rand4();peer=new Peer('prio-'+code);
 peer.on('open',id=>{myId=id;isHost=true;busy=false;S={phase:'lobby',round:1,cards:[],players:{[id]:{name,round:0,ranking:[],done:false}},chosenBy:'',mysteryWords:{}};render()});
 peer.on('connection',c=>{
  c.on('open',()=>{conns[c.peer]=c;c.send({t:'state',S})});
  c.on('data',m=>hostHandle(c.peer,m));
  c.on('close',()=>{delete conns[c.peer];if(S){delete S.players[c.peer];broadcast()}})});
 peer.on('error',e=>{if(e.type==='unavailable-id'&&tries<5){try{peer.destroy()}catch(x){}return host(tries+1)}reset('Erreur réseau ('+e.type+'). Réessaie.')})}
function join(){
 if(busy)return;name=$('nm').value.trim()||'Joueur';const c=$('cd').value.trim().toUpperCase();
 if(!c){msg='Entre le code de la salle.';return render()}
 code=c;busy=true;msg='';render();peer=new Peer();
 peer.on('open',id=>{myId=id;hostConn=peer.connect('prio-'+c,{reliable:true});
  hostConn.on('open',()=>hostConn.send({t:'hello',name}));
  hostConn.on('data',m=>{if(m.t==='state'){S=m.S;busy=false;render()}});
  hostConn.on('close',()=>reset('L’hôte a quitté la salle.'))});
 peer.on('error',e=>reset(e.type==='peer-unavailable'?'Salle introuvable.':'Erreur réseau ('+e.type+').'));
 setTimeout(()=>{if(busy&&!S)reset('Connexion impossible. Vérifie le code.')},12000)}
function sendRank(done){const m={t:'rank',round:S.round,ranking:pick,done};if(isHost)hostHandle(myId,m);else hostConn.send(m)}
function mv(i,d){const j=i+d;if(j<0||j>=pick.length)return;[pick[i],pick[j]]=[pick[j],pick[i]];sendRank(false);render()}
function validate(v){sendRank(v)}

function startRound(){
 const pIds=Object.keys(S.players).sort();
 const chosenId=pIds[(S.round - 1) % pIds.length];
 S.chosenBy=chosenId;
 const mw=S.mysteryWords[chosenId]||'Un secret bien gardé';
 S.cards=deal(mw.trim());
 S.phase='rank';
 Object.values(S.players).forEach(p=>{p.ranking=[];p.done=false;p.round=S.round});
 pick=null;
 broadcast();
}

function start(){
 const ex=draft.split('\n').map(s=>s.trim()).filter(Boolean);
 pool=[...new Set([...DEF,...ex])];
 used=[];
 startRound();
}

function submitMystery(){
 const inputEl=$('mw-input');
 const w=inputEl?inputEl.value.trim():'';
 if(!w)return;
 mysteryWord=w;
 const m={t:'mystery',round:S.round,playerId:myId,word:w};
 if(isHost)hostHandle(myId,m);
 else hostConn.send(m);
 render();
}

function nextRound(){S.round++;startRound()}
function reveal(){S.phase='reveal';broadcast()}

function render(){
 const a=$('app');let h=`<h1>Priorities</h1>${DOO()}`;
 if(!S){
  h+=busy?`<p class="s">Connexion en cours…</p>`:`<p class="s">Classe 5 concepts, puis débattez de vos choix.</p>
  <div class="card">
   <label>Ton pseudo</label><input id="nm" value="${esc(name)}" maxlength="20" placeholder="Ex: Jean-Michel">
   <label>Code de la salle</label><input id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase">
   <div class="row">
    <button onclick="join()">Rejoindre</button>
    <button class="p" onclick="create()">Créer une salle</button>
   </div>
  </div>
  <p class="s">L’hôte doit garder la page ouverte pendant toute la partie.</p>`;
  h+=`<div class="err">${esc(msg)}</div>`;a.innerHTML=h;ic();return}
 
 const ps=Object.entries(S.players).map(([id,p])=>({id,...p}));
 h+=`<p class="s">Salon <span class="code">${esc(code)}</span> · Manche ${S.round}</p>`;
 
 if(S.phase==='lobby'){
  h+=`<div class="card info-box"><b>👥 Joueurs connectés (${ps.length})</b><div style="margin-top:8px">${ps.map(p=>`<span class="tag">👤 ${esc(p.name||'Anonyme')}</span>`).join('')}</div></div>`;
  h+=isHost?`<div class="card"><h2>Paramètres de la partie</h2><p class="s" style="text-align:left;margin-bottom:10px">À chaque manche, un joueur au hasard choisira un concept secret obligatoire ! Tu peux aussi ajouter tes propres concepts de base ci-dessous (un par ligne, facultatif).</p><textarea id="dr" rows="3" oninput="draft=this.value" placeholder="Ex. : Un dossier honteux">${esc(draft)}</textarea><button class="p" onclick="start()">Lancer la partie 🚀</button></div>`:`<div class="card" style="text-align:center"><p class="s" style="margin:0">En attente que l'hôte lance la partie...</p></div>`;
 }else{
  if(!pick||pickRound!==S.round){pick=[...S.cards];pickRound=S.round}
  const me=S.players[myId]||{done:false};
  const chosenPlayer=S.players[S.chosenBy];
  const chosenName=chosenPlayer?chosenPlayer.name:'?';
  const isChosenOne=(S.chosenBy===myId);
  const myMysteryWord=S.mysteryWords[myId]||'';

  if(S.phase==='rank'){
   h+=`<h2>Manche ${S.round}</h2>`;
   if(isChosenOne){
    h+=`<div class="card mystery-box"><b>🎲 C'est ton tour !</b><p class="s" style="text-align:left;margin:4px 0 10px">Tu es désigné pour choisir <b>le mot mystère</b> de cette manche qui sera obligatoirement inclus dans les 5 concepts.</p><input id="mw-input" value="${esc(mysteryWord)}" oninput="mysteryWord=this.value" placeholder="Ex: Manger du fromage la nuit" maxlength="40"><button class="p" onclick="submitMystery()" ${myMysteryWord?'style="background:var(--gr)"':''}>${myMysteryWord?'✓ Mot validé ! (Modifier)':'Valider mon mot mystère'}</button></div>`;
   }else{
    h+=`<div class="card info-box"><b>🎲 Tour du destin</b><p class="s" style="text-align:left;margin:0">C'est <b>${esc(chosenName)}</b> qui choisit le mot mystère secret de cette manche en ce moment...</p></div>`;
   }

   h+=`<h2>Du préféré au moins préféré</h2><p class="s" style="text-align:left;margin-bottom:8px">Classe ces 5 concepts avec les flèches : le 1er est ton préféré.</p>${pick.map((c,i)=>`<div class="card rk"><b>${i+1}</b>${ico(c)}<span>${esc(c)}</span><div class="btns"><button ${me.done||i===0?'disabled':''} onclick="mv(${i},-1)">▲</button><button ${me.done||i===pick.length-1?'disabled':''} onclick="mv(${i},1)">▼</button></div></div>`).join('')}`;
   
   h+=me.done?`<button class="p" style="background:var(--gr);color:#111" onclick="validate(false)">✓ Classement validé (Modifier)</button>`:`<button class="p" onclick="validate(true)">Valider mon classement</button>`;
   
   const d=ps.filter(p=>p.done&&p.round===S.round).length;
   h+=`<div class="card"><b>Statut des joueurs (${d}/${ps.length} validés)</b><div style="margin-top:8px">${ps.map(p=>`<span class="tag ${p.done&&p.round===S.round?'done':''}">${p.done&&p.round===S.round?'✓':'⏳'} ${esc(p.name||'?')}</span>`).join('')}</div></div>`;
   
   if(isHost)h+=`<button class="p" style="background:var(--pk);color:#111;margin-top:20px" onclick="reveal()">Révéler les classements 👀</button>`;
  }else{
   const R=ps.filter(p=>p.round===S.round&&p.ranking.length===N);
   h+=`<h2>Résultats de la manche</h2>`;
   h+=`<p class="s" style="text-align:left">Le mot mystère de cette manche a été choisi par <b>${esc(chosenName)}</b>.</p>`;
   if(!R.length)h+=`<p class="s">Personne n’a validé de classement.</p>`;
   h+=`<div class="cols">${R.map(p=>`<div class="card col"><b>👤 ${esc(p.name||'?')}</b><ol>${p.ranking.map(c=>`<li>${ico(c)}${esc(c)}</li>`).join('')}</ol></div>`).join('')}</div>`;
   if(R.length>1){
    const cs=S.cards.map(c=>{const r=R.map(p=>p.ranking.indexOf(c)+1);return{c,r,s:Math.max(...r)-Math.min(...r)}});
    const pills=x=>R.map((p,i)=>`<span class="tag">${esc(p.name||'?')} : ${x.r[i]}</span>`).join('');
    const dis=[...cs].sort((a,b)=>b.s-a.s).slice(0,3),con=cs.filter(x=>x.s<=1).sort((a,b)=>a.s-b.s).slice(0,2);
    h+=`<h2>🔥 À débattre</h2>`+dis.map(x=>`<div class="card" style="border-color:var(--ac)"><b>${ico(x.c)}${esc(x.c)}</b><div style="margin-top:6px">${pills(x)}</div></div>`).join('');
    if(con.length)h+=`<h2>🤝 D’accord sur</h2>`+con.map(x=>`<div class="card" style="border-color:var(--gr)"><b>${ico(x.c)}${esc(x.c)}</b><div style="margin-top:6px">${pills(x)}</div></div>`).join('');
   }
   h+=`<p class="s" style="margin-top:20px">Chacun explique pourquoi il a classé comme ça. Débattez bien !</p>`;
   if(isHost)h+=`<button class="p" onclick="nextRound()">Manche suivante ➡️</button>`;
  }
 }
 h+=`<div class="err">${esc(msg)}</div>`;
 
 const activeId = document.activeElement ? document.activeElement.id : '';
 if(activeId==='dr'||activeId==='mw-input'||activeId==='nm'||activeId==='cd') return;
 
 a.innerHTML=h;ic();
}
render();
</script></body></html>
